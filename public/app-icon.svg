<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Bottom stack layer (tilted back) -->
  <g transform="translate(256, 248)">
    <rect x="-128" y="-80" width="256" height="160" rx="16" ry="16"
          fill="#4338CA" opacity="0.5" transform="rotate(-6)"/>
  </g>

  <!-- Middle stack layer -->
  <g transform="translate(256, 240)">
    <rect x="-120" y="-72" width="240" height="144" rx="14" ry="14"
          fill="#4F46E5" opacity="0.7" transform="rotate(-3)"/>
  </g>

  <!-- Front stack layer (chart card) -->
  <rect x="136" y="168" width="240" height="180" rx="14" ry="14"
        fill="#EEF2FF" opacity="0.95"/>

  <!-- Chart bars on front card -->
  <rect x="168" y="272" width="32" height="56" rx="6" ry="6" fill="url(#bar3)"/>
  <rect x="212" y="240" width="32" height="88" rx="6" ry="6" fill="url(#bar2)"/>
  <rect x="256" y="216" width="32" height="112" rx="6" ry="6" fill="url(#bar1)"/>
  <rect x="300" y="196" width="32" height="132" rx="6" ry="6" fill="#6366F1"/>

  <!-- Clip/scissors accent - small triangle clip at top-right -->
  <polygon points="376,168 340,168 376,204" fill="#818CF8" opacity="0.8"/>

  <!-- Small upward trend line on chart -->
  <polyline points="176,268 220,236 264,212 308,192"
            fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>